services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?.env がありません。cp .env.example .env で作ってください}
      MYSQL_DATABASE: ${DB_DATABASE:?.env がありません。cp .env.example .env で作ってください}
      MYSQL_USER: ${DB_USERNAME:?.env がありません。cp .env.example .env で作ってください}
      MYSQL_PASSWORD: ${DB_PASSWORD:?.env がありません。cp .env.example .env で作ってください}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: mysql
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build: ./backend
    command: >
      sh -c "composer install --no-interaction &&
      (grep -q '^APP_KEY=.' .env 2>/dev/null || (cp -n .env.example .env && php artisan key:generate)) &&
      php artisan serve --host=0.0.0.0 --port=8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backend:/app
      - backend-vendor:/app/vendor
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 -p 3000"
    environment:
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  mysql-data:
  backend-vendor:
  frontend-node-modules:
  frontend-next:
